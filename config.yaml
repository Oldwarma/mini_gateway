# 智能体迷你网关配置（详细设计 §9）
llm:
  provider: none            # openai | anthropic | none
                            # none → 自测走确定性模板路径；配 provider + key 才走 LLM 措辞
  model: ""
  api_key_env: ""

gate:
  latency_budget_seconds: 5

composition:
  default: llm              # llm | template
  fallback: template

data_dir: data

sources:
  - id: sec-report
    name: 示例财报
    type: file
    path: data/claims.json
    policy: allowed

# 外部智能体接入（统一适配器）：指向本机声明智能体做接入自测
external_agents:
  - name: claim-info-via-http
    url: http://127.0.0.1:8010/v1/agents/claim-info/ask
    description: 外部接入示例：经 HTTP 转发到本机声明智能体（验证统一验证+审计）
