<!-- spec: SPEC-009 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体 · 智能体迷你网关</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--border:#e2e6ec;--primary:#2563eb;--muted:#6b7280;--tag:#eff6ff;--tag-border:#bfdbfe;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#1f2937;min-height:100vh}
  nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:4px}
  nav a{padding:12px 16px;text-decoration:none;color:var(--muted);font-size:14px;border-bottom:2px solid transparent}
  nav a.active{color:var(--primary);border-color:var(--primary);font-weight:600}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px}
  header h1{font-size:17px;font-weight:600}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px}
  main{max-width:900px;margin:0 auto;padding:20px;display:grid;gap:14px}
  .agent{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px}
  .icon{width:44px;height:44px;border-radius:10px;background:var(--tag);border:1px solid var(--tag-border);display:flex;align-items:center;justify-content:center;font-size:20px}
  .agent .name{font-weight:600;font-size:15px}
  .agent .ver{color:var(--muted);font-size:11px;margin-left:6px}
  .agent .desc{color:#4b5563;font-size:13px;margin-top:4px}
  .go{margin-left:auto;color:var(--primary);text-decoration:none;font-size:13px}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <nav>
    <a href="/chat">可追踪问答</a>
    <a href="/claims">声明管理</a>
    <a href="/traces">审计中心</a>
    <a href="/agents" class="active">智能体</a>
  </nav>
  <header><h1>智能体总览</h1><div class="sub">每个智能体 = 一个标准接口；网关统一验证 + 审计 + 追踪</div></header>
  <main id="list"><div class="hint">加载中…</div></main>

<script>
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  fetch('/v1/agents').then(r=>r.json()).then(list=>{
    if(!list.length){document.getElementById('list').innerHTML='<div class="hint">暂无已注册智能体</div>';return}
    document.getElementById('list').innerHTML=list.map(a=>`
      <div class="agent">
        <div class="icon">🤖</div>
        <div><div><span class="name">${esc(a.name)}</span><span class="ver">v${esc(a.version||'1.0')}</span></div>
        <div class="desc">${esc(a.description||'')}</div></div>
        <a class="go" href="/chat">去对话 →</a>
      </div>`).join('');
  }).catch(()=>{document.getElementById('list').innerHTML='<div class="hint">加载失败</div>'});
</script>
</body>
</html>
