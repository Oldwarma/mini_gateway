<!-- spec: SPEC-009 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可追踪问答 · 智能体迷你网关</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--border:#e2e6ec;--primary:#2563eb;--primary-dark:#1d4ed8;
        --user:#2563eb;--user-text:#fff;--text:#1f2937;--muted:#6b7280;--ok:#16a34a;--err:#dc2626;
        --tag:#eff6ff;--tag-border:#bfdbfe;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:4px}
  nav a{padding:12px 16px;text-decoration:none;color:var(--muted);font-size:14px;border-bottom:2px solid transparent}
  nav a.active{color:var(--primary);border-color:var(--primary);font-weight:600}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:600}
  header .sub{font-size:12px;color:var(--muted);flex:1}
  #agentSel{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px}
  #chat{flex:1;overflow-y:auto;padding:20px;max-width:860px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:10px}.row.user{justify-content:flex-end}
  .bubble{max-width:78%;padding:12px 16px;border-radius:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .user .bubble{background:var(--user);color:var(--user-text);border-bottom-right-radius:4px}
  .bot .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
  .meta{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .tag{background:var(--tag);border:1px solid var(--tag-border);color:var(--primary-dark);padding:2px 8px;border-radius:999px;font-size:11px}
  .tag.ok{background:#f0fdf4;border-color:#bbf7d0;color:var(--ok)}
  .tag.err{background:#fef2f2;border-color:#fecaca;color:var(--err)}
  .meta a{color:var(--primary);text-decoration:none}.meta a:hover{text-decoration:underline}
  .basis{margin-top:4px}.basis li{list-style:none;padding:3px 0}
  #inputbar{background:var(--card);border-top:1px solid var(--border);padding:14px 20px}
  .box{max-width:860px;margin:0 auto;display:flex;gap:10px}
  #q{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none}
  #q:focus{border-color:var(--primary)}
  #send{padding:12px 22px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer}
  #send:hover{background:var(--primary-dark)}#send:disabled{opacity:.6;cursor:not-allowed}
  .hint{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 0}
  .typing::after{content:"…";animation:blink 1s infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
  <nav>
    <a href="/chat" class="active">可追踪问答</a>
    <a href="/claims">声明管理</a>
    <a href="/traces">审计中心</a>
    <a href="/agents">智能体</a>
  </nav>
  <header>
    <h1>可追踪问答</h1>
    <span class="sub">Agent = LLM + Harness · 每个回答可审计</span>
    <select id="agentSel"></select>
  </header>

  <div id="chat">
    <div class="row bot"><div class="bubble">你好！选择一个智能体，输入问题。试试：<br>声明智能体：「三星2024年营收是多少」<br>文档智能体：「Harness 是什么」</div></div>
  </div>

  <div id="inputbar">
    <div class="box">
      <input id="q" type="text" placeholder="输入你的问题…（Enter 发送）" autocomplete="off">
      <button id="send">发送</button>
    </div>
    <div class="hint">统一网关注入 · 七维验证门 · 全程审计追踪</div>
  </div>

<script>
  const chat=document.getElementById('chat'), q=document.getElementById('q'), send=document.getElementById('send'), sel=document.getElementById('agentSel');
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function addUser(t){const r=document.createElement('div');r.className='row user';r.innerHTML=`<div class="bubble">${esc(t)}</div>`;chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
  function addBot(m,html){const r=document.createElement('div');r.className='row bot';r.innerHTML=html;chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
  function addBotError(m){addBot('e',`<div class="bubble" style="color:var(--err)">${esc(m)}</div>`)}

  async function loadAgents(){
    try{
      const list=await (await fetch('/v1/agents')).json();
      sel.innerHTML=list.map(a=>`<option value="${esc(a.name)}">${esc(a.name)} · ${esc(a.description.slice(0,24))}</option>`).join('');
    }catch(e){ sel.innerHTML='<option>加载失败</option>'; }
  }

  function renderAnswer(d){
    const c=d.contract||{};
    const tags=[`智能体：${esc(d.agent)}`,`路径：${esc(d.composition_path||'template')}`,
      `实体：${esc(c.entity||'—')}`,`置信度：${typeof c.confidence==='number'?c.confidence:0}`].map(t=>`<span class="tag">${t}</span>`).join('');
    const basis=(c.basis||[]).map(b=>`<li>依据：<code>${esc(b)}</code></li>`).join('');
    addBot(d.answer,`<div class="bubble">${esc(d.answer)}<div class="meta"><div class="tags">${tags}</div>${basis?`<div class="basis">${basis}</div>`:''}<div style="margin-top:6px">🔎 审计：<a href="/v1/traces/${esc(d.trace_id)}" target="_blank">${esc(d.trace_id)}</a></div></div></div>`);
  }

  async function ask(){
    const text=q.value.trim(); if(!text){q.focus();return}
    const agent=sel.value;
    addUser(`[${agent}] ${text}`); q.value=''; send.disabled=q.disabled=true;
    const row=document.createElement('div');row.className='row bot';row.innerHTML='<div class="bubble typing">正在回答</div>';chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
    try{
      const resp=await fetch(`/v1/agents/${encodeURIComponent(agent)}/ask`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});
      const data=await resp.json(); row.remove();
      if(resp.ok){renderAnswer(data)}
      else if(resp.status===404){addBotError('❌ 未知智能体：'+agent)}
      else if(resp.status===422){addBotError('❌ 请求无效：问题不能为空（1~500 字符）。')}
      else{const dt=data&&data.detail;const tid=dt&&typeof dt==='object'&&dt.trace_id||'';addBotError(`❌ 网关失败（熔断）${tid?'trace '+tid:''}，可用该 trace 审计。`)}
    }catch(e){row.remove();addBotError('❌ 网络错误，无法连接网关服务。')}
    finally{send.disabled=false;q.disabled=false;q.focus()}
  }
  send.addEventListener('click',ask); q.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
  loadAgents(); q.focus();
</script>
</body>
</html>
