<!-- spec: SPEC-009 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计中心 · 智能体迷你网关</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--border:#e2e6ec;--primary:#2563eb;--muted:#6b7280;--ok:#16a34a;--err:#dc2626;--tag:#eff6ff;--tag-border:#bfdbfe;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#1f2937;min-height:100vh}
  nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:4px}
  nav a{padding:12px 16px;text-decoration:none;color:var(--muted);font-size:14px;border-bottom:2px solid transparent}
  nav a.active{color:var(--primary);border-color:var(--primary);font-weight:600}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px}
  header h1{font-size:17px;font-weight:600}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px}
  main{max-width:1080px;margin:0 auto;padding:20px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
  th{background:#f9fafb;color:var(--muted);font-weight:600;font-size:12px}
  tr:hover td{background:#f8fafc}
  a{color:var(--primary);text-decoration:none}
  .ok{color:var(--ok)}.err{color:var(--err)}
  .tag{background:var(--tag);border:1px solid var(--tag-border);color:var(--primary);padding:1px 8px;border-radius:999px;font-size:11px}
  .empty{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>
  <nav>
    <a href="/chat">可追踪问答</a>
    <a href="/claims">声明管理</a>
    <a href="/traces" class="active">审计中心</a>
    <a href="/agents">智能体</a>
  </nav>
  <header><h1>审计中心</h1><div class="sub">跨智能体的统一审计追踪：每个回答 → 用了哪些声明/证据 → 验证结果 → 原始来源</div></header>
  <main>
    <table>
      <thead><tr><th>时间</th><th>智能体</th><th>问题</th><th>路径</th><th>验证</th><th>trace_id</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">暂无审计记录</div>
  </main>

<script>
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rows=document.getElementById('rows');
  fetch('/v1/traces?limit=100').then(r=>r.json()).then(list=>{
    if(!list.length){document.getElementById('empty').style.display='block';return}
    rows.innerHTML=list.map(t=>{
      const v=t.validation||{};
      const fails=Object.values(v).filter(x=>x===false).length;
      const pass=fails===0 && !!t.answer;
      const tag=`<span class="tag">${esc(t.agent||'?')}</span>`;
      return `<tr>
        <td>${esc((t.created_at||'').replace('T',' ').slice(0,19))}</td>
        <td>${tag}</td>
        <td>${esc(t.question.slice(0,40))}${t.question.length>40?'…':''}</td>
        <td>${esc(t.composition_path||'—')}</td>
        <td class="${pass?'ok':'err'}">${pass?'✓ 通过':fails+' 项失败'}</td>
        <td><a href="/v1/traces/${esc(t.trace_id)}" target="_blank">${esc(t.trace_id)}</a></td>
      </tr>`;
    }).join('');
  }).catch(()=>{rows.innerHTML='<tr><td colspan="6" class="empty">加载失败</td></tr>'});
</script>
</body>
</html>
